<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Requirements · Markdown OKF-Schema Studio</title>
<style>
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1);--max:1180px}
[data-theme=cream]{--bg:#f6f1e7;--paper:#fffdf8;--ink:#2b2620;--soft:#6f665a;--faint:#c9bfae;--line:#e6decf;--accent:#b5532a;--p2:#7a4fa0;--nom:#2f8f6f;--bnd:#2d6fb0;--ref:#c0392b;--alt:#a89c88;--shadow:0 1px 2px rgba(60,40,10,.05),0 10px 30px rgba(60,40,10,.07)}
[data-theme=white]{--bg:#ffffff;--paper:#ffffff;--ink:#1d1f24;--soft:#5f6570;--faint:#c7cbd2;--line:#e7e9ee;--accent:#c2410c;--p2:#6d28d9;--nom:#047857;--bnd:#1d4ed8;--ref:#b91c1c;--alt:#9aa1ad;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 26px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#15140f;--paper:#1f1d17;--ink:#efe8da;--soft:#a99f8d;--faint:#4d463b;--line:#332f26;--accent:#f08a5d;--p2:#b896de;--nom:#5fd0a8;--bnd:#7fb0ee;--ref:#ff7a6b;--alt:#6d6455;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .35s,color .35s;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .in{max-width:var(--max);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.mark{display:flex;gap:2px;flex:none} .mark i{width:5px;height:18px;border-radius:2px}
.brand{font:600 14px var(--sans);white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;font:13px var(--sans);color:var(--soft);overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:1;min-width:0}
.crumbs::-webkit-scrollbar{display:none}
.crumbs a{color:var(--ink);padding:3px 8px;border-radius:999px;transition:.2s}
.crumbs a:hover{background:var(--line)}
.crumbs .sep{color:var(--faint)}
.crumbs .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.tools{display:flex;gap:6px;flex:none}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font:13px var(--sans);cursor:pointer;display:flex;gap:8px;align-items:center;transition:.2s}
.ib:hover{border-color:var(--ink)}
.ib[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ib kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--soft)}
main{max-width:var(--max);margin:0 auto;padding:34px 24px 80px}
.view{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font:600 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent))}
h1{font:400 clamp(28px,4.2vw,44px)/1.08 var(--serif);margin:10px 0 12px;letter-spacing:-.01em;max-width:900px}
h1 em{font-style:italic;color:var(--accent)}
.lede{font:clamp(15px,1.6vw,17px)/1.6 var(--serif);color:var(--soft);max-width:760px;margin:0}
.meta{font:12.5px var(--sans);color:var(--soft)}
.meta b{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font:11px var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--soft);background:var(--paper)}
.chip.line{color:#fff;border-color:transparent;background:var(--c)}
.chip.approved{color:var(--nom);border-color:var(--nom)}
.chip.old{color:var(--ref);border-color:var(--ref)}
/* ---------- view 1: lines ---------- */
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:30px}
.lc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px 22px;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s;display:flex;flex-direction:column;gap:8px;animation:enter .5s var(--ease) both}
.lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.lc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.lc h2{font:400 21px/1.2 var(--serif);margin:0;display:flex;align-items:center;gap:10px}
.lc h2 .n{font:700 11px var(--mono);color:#fff;background:var(--c);border-radius:6px;padding:3px 6px}
.lc p{margin:0;font:14px/1.5 var(--serif);color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lc .meta{margin-top:auto;padding-top:6px}
/* ---------- view 2: one line ---------- */
.head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.stations{margin-top:30px;position:relative;padding-left:46px}
.stations::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:8px;border-radius:4px;background:var(--c)}
.sta{position:relative;display:block;padding:14px 18px 16px;margin-bottom:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;transition:transform .25s var(--ease),box-shadow .25s;animation:enter .5s var(--ease) both}
.sta::before{content:"";position:absolute;left:-38px;top:20px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-sizing:border-box}
.sta.has::before{border-color:var(--c);width:20px;height:20px;left:-40px;top:18px;border-width:5px}
.sta:hover{transform:translateX(4px);box-shadow:var(--shadow)}
.sta h3{font:400 20px/1.25 var(--serif);margin:4px 0 6px}
.sta q{display:block;font:italic 14.5px/1.5 var(--serif);color:var(--soft);quotes:"“" "”";display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sta .top{display:flex;justify-content:space-between;gap:10px;align-items:center;font:11.5px var(--mono);color:var(--soft)}
.sta.oldr{opacity:.55}.sta.oldr h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.sec{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:34px 0 12px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* ---------- view 3: metro ---------- */
.need{font:italic clamp(15px,1.7vw,18px)/1.55 var(--serif);color:var(--soft);border-left:3px solid var(--c);padding-left:14px;margin:6px 0 0;max-width:820px}
.mapbox{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 8px 6px;position:relative}
.maptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 10px 2px}
.maptools .legend{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--sans);color:var(--soft);margin-left:auto}
.legend b{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend b.d{width:8px;height:8px;border-radius:50%}
svg.metro{display:block;width:100%;height:auto}
.metro .st circle{fill:var(--paper);stroke:var(--ink);stroke-width:3.5}
.metro .st.goal circle.o{stroke:var(--accent);stroke-width:5}
.metro .st.alt circle{stroke:var(--alt);stroke-width:2.5}
.metro .st text{font:500 13px var(--sans);fill:var(--ink)}
.metro .st.alt text{fill:var(--soft);font-style:italic;font-family:var(--serif)}
.metro .tr{cursor:pointer}
.metro .tr .hit{stroke:transparent;stroke-width:26;fill:none}
.metro .tr .ln{fill:none;transition:stroke-width .2s}
.metro .tr:hover .ln{stroke-width:10}
.metro .tr:hover .pill rect{stroke-width:2.5}
.metro .pill text{font:700 11px var(--mono);fill:var(--ink)}
.metro .verb{font:italic 12.5px var(--serif);fill:var(--soft)}
.metro.playing .tr:not(.on),.metro.playing .st:not(.on){opacity:.2}
.metro .tok{filter:drop-shadow(0 0 6px var(--accent))}
/* vertical metro (phone) */
.vmetro{padding:6px 8px 10px}
.vpath{position:relative;margin:8px 0 18px}
.vpath h4{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pc);margin:6px 0 10px 4px}
.vst{display:grid;grid-template-columns:34px 1fr;align-items:start;min-height:34px}
.vst .rail{position:relative;height:100%;min-height:34px}
.vst .rail::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:7px;background:var(--pc);border-radius:3px}
.vst.first .rail::before{top:14px}.vst.last .rail::before{bottom:calc(100% - 14px)}
.vst .rail i{position:absolute;left:5px;top:6px;width:23px;height:23px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-sizing:border-box}
.vst.goal .rail i{border-color:var(--accent);border-width:5px}
.vst .txt{font:500 15px/1.35 var(--sans);padding:8px 0 4px}
.vtr{display:grid;grid-template-columns:34px 1fr;min-height:44px}
.vtr .rail{position:relative}.vtr .rail::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:7px;background:var(--pc);border-radius:3px}
.vtr a{margin:4px 0 8px;display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--pc);background:var(--paper)}
.vtr a .id{font:700 11.5px var(--mono)}
.vtr a .v{font:italic 13.5px var(--serif);color:var(--soft)}
.vopt{display:grid;grid-template-columns:34px 1fr}
.vopt .rail{position:relative}.vopt .rail::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:7px;background:var(--pc);border-radius:3px}
.vopt a{margin:2px 0 6px;font:13px/1.4 var(--serif);color:var(--soft);border:1px dashed var(--alt);border-radius:10px;padding:6px 10px;display:block}
.vopt a b{font:700 11px var(--mono);color:var(--ink);font-style:normal}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.k-nominal{background:var(--nom)}.k-boundary{background:var(--bnd)}.k-refusal{background:var(--ref)}
.empty{font:italic 15px/1.6 var(--serif);color:var(--soft);padding:18px;border:1px dashed var(--faint);border-radius:14px;margin-top:20px}
.rows a{display:flex;gap:12px;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.rows a:hover{background:color-mix(in srgb,var(--c,var(--accent)) 7%,transparent)}
.rows a .id{font:600 11.5px var(--mono);color:var(--soft);flex:none;width:92px}
.rows a .t{font:16px/1.35 var(--serif)}
.rows a .r{margin-left:auto;font:11.5px var(--mono);color:var(--soft);white-space:nowrap}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rows a:last-child{border-bottom:0}
/* ---------- view 4: behaviour ---------- */
.rule{font:clamp(17px,1.9vw,20px)/1.6 var(--serif);max-width:860px;margin:6px 0 0}
.rule strong{color:var(--accent);font-weight:600;letter-spacing:.04em}
.partof{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.partof a{display:flex;flex-direction:column;padding:9px 13px;border-radius:12px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);font:14px/1.3 var(--serif);max-width:420px;transition:.2s}
.partof a:hover{box-shadow:var(--shadow)}
.partof a small{font:11px var(--mono);color:var(--soft);margin-bottom:2px}
details.scn{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.scn summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;font:15.5px var(--serif)}
details.scn summary::-webkit-details-marker{display:none}
details.scn summary .k{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#fff;border-radius:5px;padding:3px 7px;flex:none}
details.scn summary::after{content:"+";margin-left:auto;color:var(--soft);font:20px var(--sans);transition:transform .25s}
details.scn[open] summary::after{transform:rotate(45deg)}
.gwt{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.gwt div{padding:12px 14px;font:13.5px/1.5 var(--sans);border-right:1px solid var(--line)}
.gwt div:last-child{border-right:0}
.gwt b{display:block;font:700 10px var(--sans);letter-spacing:.16em;margin-bottom:4px}
.gwt .g b{color:var(--accent)}.gwt .w b{color:var(--p2)}.gwt .t b{color:var(--nom)}
.files{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fl a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--paper);font:12.5px var(--mono);transition:.2s;word-break:break-all}
.fl a:hover{border-color:var(--fc);transform:translateX(3px)}
.fl a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc);flex:none}
.fl a span{color:var(--soft)}
.fl a::after{content:"↗";margin-left:auto;color:var(--soft)}
.note{border-left:3px solid var(--ref);background:color-mix(in srgb,var(--ref) 7%,transparent);border-radius:0 12px 12px 0;padding:10px 14px;font:14px/1.55 var(--serif);white-space:pre-wrap}
.small{font:13.5px/1.6 var(--serif);color:var(--soft);max-width:860px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.pager a{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font:14px/1.35 var(--serif);transition:.2s}
.pager a:hover{box-shadow:var(--shadow)}
.pager a small{display:block;font:11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
.pager a.next{text-align:right}
/* ---------- step additions ---------- */
.ribbon{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-top:28px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.ribbon a{min-width:4px;transition:filter .2s,transform .2s}
.ribbon a:hover{filter:brightness(1.15) saturate(1.2);transform:scaleY(1.35)}
.ribbon-l{display:flex;justify-content:space-between;margin-top:8px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px;align-items:start}
.aside{position:sticky;top:84px;margin-top:30px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h6{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.xfer{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font:14px var(--serif)}
.xfer:first-of-type{border-top:0}
.xfer i{width:22px;height:22px;border-radius:50%;border:4px solid var(--x);box-sizing:border-box;flex:none;background:var(--paper)}
.xfer span{margin-left:auto;font:11.5px var(--mono);color:var(--soft)}
.xfer:hover{color:var(--x)}
.lcbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:4px 0 8px}
.mapfoot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
.pick{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--pc,var(--accent));border-radius:14px;padding:16px 18px;min-height:200px;transition:border-color .3s}
.pick .id{font:600 11.5px var(--mono);color:var(--soft);display:flex;gap:10px;align-items:center}
.pick h3{font:400 21px/1.25 var(--serif);margin:6px 0 8px}
.pick p{font:14.5px/1.55 var(--serif);margin:0 0 12px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pick .go{display:inline-flex;gap:8px;align-items:center;font:600 13px var(--sans);color:var(--paper);background:var(--ink);padding:8px 14px;border-radius:999px}
.pick .go:hover{background:var(--accent)}
.combo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.combo div{background:var(--bg);border-radius:10px;padding:10px 12px}
.combo .n{font:400 28px/1 var(--serif)}
.combo .l{font:11.5px/1.35 var(--sans);color:var(--soft);margin-top:5px}
.combo .a .n{color:var(--accent)}.combo .c .n{color:var(--nom)}
.walks{display:flex;align-items:flex-end;gap:3px;height:64px;margin:12px 0 18px}
.walks i{flex:1;background:var(--faint);border-radius:3px 3px 0 0;position:relative;animation:rise .8s var(--ease) both}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.walks i{transform-origin:bottom}
.walks i span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font:9.5px var(--mono);color:var(--soft)}
.metro .tr.sel .ln{stroke-width:11}
.metro .tr.sel .pill rect{fill:var(--ink)}.metro .tr.sel .pill text{fill:var(--paper)}
.strip{display:flex;align-items:center;margin:18px 0 0;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;gap:0;overflow-x:auto}
.strip .lbl{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-right:16px;white-space:nowrap}
.strip a{display:flex;align-items:center;flex:1;min-width:38px}
.strip a i{width:14px;height:14px;border-radius:50%;border:3.5px solid var(--ink);background:var(--paper);box-sizing:border-box;flex:none}
.strip a b{flex:1;height:5px;background:var(--pc);min-width:20px}
.strip a.cur b{background:repeating-linear-gradient(90deg,var(--pc) 0 6px,transparent 6px 9px);animation:march .8s linear infinite}
@keyframes march{to{background-position:9px 0}}
.strip a.cur i{border-color:var(--pc)}
.strip a:last-child{flex:none}
.strip .here{font:12px var(--serif);font-style:italic;color:var(--soft);margin-left:16px;white-space:nowrap}
.tkind{font:600 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--line);color:var(--soft);margin-left:auto;flex:none}
.fl a::after{margin-left:8px}
.fgroup{font:11px var(--mono);color:var(--soft);margin:12px 0 6px}
.proto{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--ink);box-shadow:var(--shadow);font:12px var(--sans)}
.proto a{color:var(--paper);opacity:.6;padding:6px 11px;border-radius:999px;white-space:nowrap}
.proto a.on{opacity:1;background:color-mix(in srgb,var(--paper) 18%,transparent)}
.proto a:hover{opacity:1}
@media (max-width:900px){.split{grid-template-columns:1fr}.aside{position:static}.mapfoot{grid-template-columns:1fr}}
@media (max-width:700px){.strip{flex-wrap:wrap}.strip .here{flex-basis:100%;margin:8px 0 0;white-space:normal}.proto a .w{display:none}.combo .n{font-size:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- search ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.sheet.open{display:flex;animation:enter .2s var(--ease)}
.sbox{width:min(680px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.sbox input{border:0;outline:0;background:transparent;color:var(--ink);font:18px var(--serif);padding:18px 20px;border-bottom:1px solid var(--line)}
.sres{overflow:auto}
.sres h5{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:14px 20px 6px}
.sres a{display:block;padding:9px 20px;font:15px/1.35 var(--serif);border-left:3px solid transparent}
.sres a small{display:block;font:11px var(--mono);color:var(--soft)}
.sres a.sel,.sres a:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);border-left-color:var(--c,var(--accent))}
.sres .none{padding:20px;color:var(--soft);font:italic 15px var(--serif)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--paper);font:13px/1.4 var(--serif);padding:8px 11px;border-radius:9px;max-width:320px;opacity:0;transition:opacity .15s}
.tip small{display:block;font:10.5px var(--mono);opacity:.75}
footer{max-width:var(--max);margin:0 auto;padding:0 24px 40px;font:12px var(--sans);color:var(--soft)}
/* ---------- phone ---------- */
@media (max-width:760px){.maptools .ib{display:none}}
@media (max-width:700px){
  .bar .in{padding:10px 14px;gap:10px}
  .brand,.ib .lbl,.ib kbd{display:none}
  main{padding:22px 16px 60px}
  .head{grid-template-columns:1fr}
  .stations{padding-left:36px}.stations::before{left:11px;width:7px}
  .sta::before{left:-33px;width:15px;height:15px}.sta.has::before{left:-35px;width:19px;height:19px}
  .sta h3{font-size:17.5px}
  .gwt{grid-template-columns:1fr}.gwt div{border-right:0;border-bottom:1px solid var(--line)}
  .files{grid-template-columns:1fr}
  .rows a{flex-wrap:wrap}.rows a .id{width:auto}.rows a .r{margin-left:0}
  .pager{flex-direction:column}
  .sheet{padding:0}.sbox{max-height:100vh;height:100%;border-radius:0}
}

<body>
<div class="bar"><div class="in">

  <a href="#/" class="brand">Studio requirements</a>

    <button class="ib" id="hist" aria-pressed="false" title="Show superseded and deprecated requirements"><span>⟲</span><span class="lbl">History</span></button>

</div></div>
<main id="main"></main>
<footer id="foot"></footer>
<div class="sheet" id="sheet"><div class="sbox"><div style="display:flex;align-items:center;border-bottom:1px solid var(--line)"><input id="q" style="flex:1;min-width:0;border-bottom:0" placeholder="Search areas, use cases, behaviours, files…" autocomplete="off" enterkeyhint="search"><button class="ib" id="sclose" style="margin-right:12px">Close</button></div><div class="sres" id="sres"></div></div></div>

<script src="journey-data.js"></script>
<script>

addEventListener("hashchange", route);

// ---------- view 3: the use case as a metro map ----------

const mq = matchMedia("(max-width: 760px)");
mq.addEventListener("change", () => metroState && drawMetro());

function pick(sw, via, pi) {
  const el = document.getElementById("pick"); if (!el || !sw) return;

  el.innerHTML = `<div class="id">${sid(sw.id)} ${dots(sw.sc.filter(s => !via.kind || s[0] === via.kind))} <span>${sw.te.length} test files</span></div><h3>${esc(sw.ti)}</h3><p>${esc(sw.de)}</p><a class="go" href="#/behaviour/${sw.id}">Open the behaviour →</a>`;

function combo(paths) {
  const el = document.getElementById("combo"); if (!el) return;
  const {S, T} = graph(paths); const out = new Map();
  for (const t of T) { const sw = byId.get(t.via.id); const n = sw ? Math.max(1, sw.sc.filter(s => !t.via.kind || s[0] === t.via.kind).length) : 1; if (!out.has(t.a)) out.set(t.a, []); for (let i = 0; i < n; i++) out.get(t.a).push(t.b); }
  const start = S.get(paths[0].steps[0].state); let cur = new Map([[start, 1]]); const by = [];
  for (let L = 1; L <= 8; L++) { const nx = new Map(); let tot = 0; for (const [n, c] of cur) for (const b of out.get(n) || []) { nx.set(b, (nx.get(b) || 0) + c); tot += c; } by.push(tot); cur = nx; }
  const total = by.reduce((a, b) => a + b, 0), sws = new Set(T.map(t => t.via.id)), scen = [...sws].reduce((a, id) => a + (byId.get(id)?.sc.length || 0), 0), mx = Math.max(...by, 1);

    <div class="walks">${by.map((v, i) => `<i style="height:${6 + 94 * Math.log1p(v) / Math.log1p(mx)}%;animation-delay:${i * 60}ms" title="${v} ways of ${i + 1} steps"><span>${i + 1}</span></i>`).join("")}</div><p class="small" style="margin:6px 0 0;font-size:12.5px">Testing every way through is out of reach; each behaviour is tested on its own, and the use case names the paths that matter.</p>`;
}
// ---------- view 4: one behaviour ----------
function viewSwrs(r) {
  const parents = r.df.map(p => byId.get(p)).filter(Boolean);
  const home = parents.find(p => p.s === r.s) || parents[0];
  crumb([{t: "All areas", href: "#/"}, {t: title(r.s), href: `#/area/${r.s}`, dot: COL[r.s]}, ...(home ? [{t: sid(home.id), href: `#/use-case/${home.id}`}] : []), {t: sid(r.id)}]);
  const where = p => { const mp = D.mainPaths[p.id]; if (!mp) return ""; for (const [pi, path] of mp.entries()) for (const [i, s] of path.steps.entries()) { if (s.via?.id === r.id) return `step ${i + 1} of path ${pi + 1}`; if (s.options.some(o => o.id === r.id)) return `an option at step ${i + 1} of path ${pi + 1}`; } return ""; };
  const sibs = home ? (kids.get(home.id) || []).filter(vis) : []; const k = sibs.indexOf(r);
  const prev = k > 0 ? sibs[k - 1] : null, next = k >= 0 && k < sibs.length - 1 ? sibs[k + 1] : null;
  let strip = "";
  if (home && D.mainPaths[home.id]) { for (const [pi, path] of D.mainPaths[home.id].entries()) { const i = path.steps.findIndex(s => s.via?.id === r.id); if (i < 0) continue;
    strip = `<div class="strip" style="--pc:${pi ? "var(--p2)" : "var(--accent)"}"><span class="lbl">Path ${pi + 1}</span>${path.steps.map((s, j) => `<a href="#/use-case/${home.id}" class="${j === i ? "cur" : ""}" title="${esc(s.state)}"><i></i>${j < path.steps.length - 1 ? "<b></b>" : ""}</a>`).join("")}<span class="here">step ${i + 1} of ${path.steps.length}: ${esc(path.steps[i].state)} → ${esc(path.steps[i + 1].state)}</span></div>`; break; } }
  const kind = f => /^test\/integration/.test(f) ? "integration" : /^test\/visual/.test(f) ? "visual" : /^sphinx/.test(f) ? "sphinx" : /^test\/build/.test(f) ? "build" : "unit";
  const split = f => { const i = f.lastIndexOf("/"); return `<span>${esc(f.slice(0, i + 1))}</span>${esc(f.slice(i + 1))}`; };
  const gwt = s => { const g = s[2].filter(x => /^(GIVEN|AND)/.test(x)), w = s[2].filter(x => /^WHEN/.test(x)), t = s[2].filter(x => /^THEN/.test(x)); const c = a => a.map(x => esc(x.replace(/^(GIVEN|WHEN|THEN|AND)\s+/, ""))).join("<br>"); return `<div class="gwt"><div class="g"><b>GIVEN</b>${c(g)}</div><div class="w"><b>WHEN</b>${c(w)}</div><div class="t"><b>THEN</b>${c(t)}</div></div>`; };
  main.innerHTML = `<div class="view" style="--c:${COL[r.s]}"><div class="kicker">Behaviour · ${sid(r.id)} ${lcChip(r)}</div><h1>${esc(r.ti)}</h1>
    <p class="rule">${esc(r.de).replace(/\bSHALL( NOT)?\b/, m => `<strong>${m}</strong>`)}</p>
    ${strip}
    ${parents.length ? `<div class="partof">${parents.map(p => `<a href="#/use-case/${p.id}" style="--c:${COL[p.s]}"><small>part of ${sid(p.id)}${where(p) ? " · " + where(p) : ""}</small>${esc(p.ti)}</a>`).join("")}</div>` : ""}
    ${r.sb.length ? `<div class="partof">${r.sb.map(id => `<a href="#/behaviour/${id}" style="--c:var(--ref)"><small>superseded by</small>${esc(byId.get(id)?.ti || id)}</a>`).join("")}</div>` : ""}
    ${r.ki ? `<div class="sec" style="color:var(--ref)">Known issue</div><div class="note">${esc(r.ki)}</div>` : ""}
    <div class="sec">Scenarios · ${r.sc.length}</div>${r.sc.map((s, i) => `<details class="scn" ${i === 0 ? "open" : ""}><summary><span class="k k-${s[0]}">${s[0]}</span>${esc(s[1])}</summary>${gwt(s)}</details>`).join("") || `<p class="small">Stated as one rule, without scenarios.</p>`}
    <div class="files"><div class="fl" style="--fc:var(--nom)"><div class="sec">Code · ${r.im.length}</div>${r.im.map(f => `<a href="${REPO + f}" target="_blank" rel="noopener">${split(f)}</a>`).join("") || `<p class="small">No code marker${r.vn ? "" : ""}.</p>`}</div>
      <div class="fl" style="--fc:var(--bnd)"><div class="sec">Proof · ${r.te.length}</div>${r.te.map(f => `<a href="${REPO + f}" target="_blank" rel="noopener">${split(f)}<em class="tkind">${kind(f)}</em></a>`).join("")}</div></div>
    ${r.vn ? `<div class="sec">How it is verified</div><p class="small">${esc(r.vn)}</p>` : ""}
    <div class="pager">${prev ? `<a href="#/behaviour/${prev.id}"><small>← previous behaviour</small>${esc(prev.ti)}</a>` : "<span></span>"}${next ? `<a class="next" href="#/behaviour/${next.id}"><small>next behaviour →</small>${esc(next.ti)}</a>` : ""}</div></div>`;
}
// ---------- search ----------
const sheet = document.getElementById("sheet"), q = document.getElementById("q"), sres = document.getElementById("sres"); let hits = [], sel = 0;

function closeSearch() { sheet.classList.remove("open"); q.blur(); }
document.getElementById("sbtn").onclick = openSearch;
document.getElementById("sclose").onclick = closeSearch;
sheet.onclick = e => { if (e.target === sheet) closeSearch(); };
function doSearch() {
  const t = q.value.trim().toLowerCase(); hits = []; let html = "";
  if (t.length < 2) { sres.innerHTML = `<div class="none">Type a word, an id such as DIAG-015, or a file name.</div>`; return; }
  const m = s => s.toLowerCase().includes(t);
  const areas = SCOPES.filter(s => m(title(s)) || m(D.groups[s].desc)).slice(0, 4).map(s => ({h: `#/area/${s}`, c: COL[s], t: title(s), s: "area"}));
  const uc = D.reqs.filter(r => vis(r) && r.t === "StRS" && (m(r.id) || m(r.ti) || m(r.un || ""))).slice(0, 8).map(r => ({h: `#/use-case/${r.id}`, c: COL[r.s], t: r.ti, s: `${r.id} · ${title(r.s)}`}));
  const be = D.reqs.filter(r => vis(r) && r.t === "SwRS" && (m(r.id) || m(r.ti) || m(r.de) || r.im.some(m) || r.te.some(m))).slice(0, 14).map(r => ({h: `#/behaviour/${r.id}`, c: COL[r.s], t: r.ti, s: `${r.id} · ${title(r.s)}`}));

  for (const [name, list] of [["Areas", areas], ["Use cases", uc], ["Behaviours", be], ["Files: show what they anchor", files]]) { if (!list.length) continue; html += `<h5>${name}</h5>` + list.map(x => { hits.push(x); return `<a href="${x.h || "#"}" data-i="${hits.length - 1}" style="--c:${x.c || "var(--soft)"}"><small>${esc(x.s)}</small>${esc(x.t)}</a>`; }).join(""); }

}
function mark() { sres.querySelectorAll("[data-i]").forEach(a => a.classList.toggle("sel", +a.dataset.i === sel)); sres.querySelector(".sel")?.scrollIntoView({block: "nearest"}); }
q.oninput = doSearch;
q.onkeydown = e => { if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); mark(); } else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); mark(); } else if (e.key === "Enter" && hits[sel]) { const x = hits[sel]; if (x.file) { q.value = x.file; doSearch(); } else { location.hash = x.h; closeSearch(); } } else if (e.key === "Escape") closeSearch(); else return; e.preventDefault(); };
addEventListener("keydown", e => { if (sheet.classList.contains("open") || /INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); } });
