<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>chantier: the surface server and its watchers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      .t{font-size:13px;fill:#0f172a}
      .s{font-size:11.5px;fill:#334155}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .k{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#64748b}
      .m{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#0f172a}
      .now{fill:#ffffff;stroke:#334155;stroke-width:1.5}
      .later{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5;stroke-dasharray:6 4}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .lf{stroke:#c2410c;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1280" height="900" fill="#f8fafc"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">The surface server and its watchers</text>
  <text x="32" y="68" class="s">One elected process per planning surface and machine. Solid: on main today (board, forge hub, session watcher). Dashed orange: what the foundations make room for.</text>

  <!-- left: sessions -->
  <text x="32" y="108" class="k">AGENT SESSIONS (each wakes on its watcher's end)</text>
  <rect x="32" y="120" width="300" height="92" rx="10" class="now"/>
  <text x="48" y="144" class="h">Chief of Staff</text>
  <text x="48" y="164" class="s">talks with the user, gives orders</text>
  <rect x="48" y="174" width="268" height="26" rx="6" fill="#e2e8f0"/>
  <text x="58" y="191" class="m">watcher: watch --after n  (one per session)</text>

  <rect x="32" y="226" width="300" height="74" rx="10" class="now"/>
  <text x="48" y="250" class="h">Griller</text>
  <rect x="48" y="262" width="268" height="26" rx="6" fill="#e2e8f0"/>
  <text x="58" y="279" class="m">watcher (board events, CR-384)</text>

  <rect x="32" y="314" width="300" height="74" rx="10" class="later"/>
  <text x="48" y="338" class="h">Foreman</text>
  <text x="48" y="358" class="s">woken directly on a merge or a red CI,</text>
  <text x="48" y="374" class="s">no Chief of Staff turn in between</text>

  <rect x="32" y="402" width="300" height="74" rx="10" class="later"/>
  <text x="48" y="426" class="h">Drivers</text>
  <text x="48" y="446" class="s">woken on their own PR's CI or review,</text>
  <text x="48" y="462" class="s">instead of polling with gh</text>

  <!-- center: server -->
  <rect x="400" y="96" width="500" height="600" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="420" y="124" class="h" fill="#312e81">Surface server</text>
  <text x="420" y="144" class="s">one per surface and machine: holds the OS lock chantier/hub.lock (the election)</text>

  <rect x="420" y="160" width="460" height="118" rx="10" class="now"/>
  <text x="436" y="184" class="h">Event log and router</text>
  <text x="436" y="204" class="s">today: forge-journal.jsonl per project, a watcher ends 20 s after the last new line</text>
  <rect x="436" y="214" width="428" height="54" rx="8" class="later"/>
  <text x="448" y="234" class="s">later: typed, addressed events (project, role, session or CR, needs-user);</text>
  <text x="448" y="252" class="s">buffer, filter, rate-limit; wake only the watcher an event is for</text>

  <rect x="420" y="292" width="222" height="112" rx="10" class="now"/>
  <text x="436" y="316" class="h">Forge reader</text>
  <text x="436" y="336" class="s">gh / glab, read-only,</text>
  <text x="436" y="352" class="s">at most every 20 s</text>
  <text x="436" y="368" class="s">merges, red CI</text>
  <text x="436" y="390" class="s" fill="#c2410c">later: reviews, ready PRs</text>

  <rect x="658" y="292" width="222" height="112" rx="10" class="now"/>
  <text x="674" y="316" class="h">Web board</text>
  <text x="674" y="336" class="s">HTML pages behind a key,</text>
  <text x="674" y="352" class="s">backlog and config edits</text>
  <text x="674" y="368" class="s">(today a separate process)</text>
  <text x="674" y="390" class="s" fill="#c2410c">later: a JSON API, same rules</text>

  <rect x="420" y="418" width="222" height="124" rx="10" class="later"/>
  <text x="436" y="442" class="h">User notifications</text>
  <text x="436" y="462" class="s">a PR ready to review,</text>
  <text x="436" y="478" class="s">the Chief of Staff asks you,</text>
  <text x="436" y="494" class="s">a budget or a slot limit hit</text>
  <text x="436" y="518" class="s">push to the phone</text>

  <rect x="658" y="418" width="222" height="124" rx="10" class="later"/>
  <text x="674" y="442" class="h">Delegated actions</text>
  <text x="674" y="462" class="s">answer a question, change</text>
  <text x="674" y="478" class="s">slots or budget: written as</text>
  <text x="674" y="494" class="s">an event the Chief of Staff</text>
  <text x="674" y="510" class="s">records as an order</text>
  <text x="674" y="530" class="s">(the board still edits no batch)</text>

  <rect x="420" y="556" width="460" height="124" rx="10" class="now"/>
  <text x="436" y="580" class="h">Store</text>
  <text x="436" y="600" class="s">today: the planning folder's JSON and Markdown, read on each request</text>
  <rect x="436" y="612" width="428" height="56" rx="8" class="later"/>
  <text x="448" y="632" class="s">later: an index behind one read interface (SQLite or Dolt),</text>
  <text x="448" y="650" class="s">rebuilt from the files; the files stay the truth, in git</text>

  <!-- right -->
  <text x="960" y="108" class="k">OUTSIDE</text>
  <rect x="960" y="120" width="288" height="92" rx="10" class="now"/>
  <text x="976" y="144" class="h">Forge</text>
  <text x="976" y="164" class="s">GitHub (or GitLab): PRs, CI, reviews</text>
  <text x="976" y="182" class="s">the user merges</text>

  <rect x="960" y="232" width="288" height="110" rx="10" class="now"/>
  <text x="976" y="256" class="h">Planning surface (git)</text>
  <text x="976" y="276" class="s">projects/&lt;name&gt;/changes/…</text>
  <text x="976" y="292" class="s">batch records, events.jsonl,</text>
  <text x="976" y="308" class="s">chantier.yaml, journals</text>
  <text x="976" y="328" class="s">sessions write it through the CLI</text>

  <rect x="960" y="362" width="288" height="112" rx="10" class="now"/>
  <text x="976" y="386" class="h">The user</text>
  <text x="976" y="406" class="s">desktop or phone browser on the LAN</text>
  <text x="976" y="422" class="s">Remote Control on the sessions</text>
  <text x="976" y="446" class="s" fill="#c2410c">later: notified, acts from the phone</text>

  <!-- arrows -->
  <path d="M960,196 L930,196 L930,286 L650,286 L650,348 L645,348" class="ln" marker-end="url(#a)"/>
  <text x="934" y="240" class="s">read</text>
  <path d="M531,292 L531,280" class="ln" marker-end="url(#a)"/>
  <path d="M420,186 L320,187" class="ln" marker-end="url(#a)"/>
  <text x="340" y="180" class="s">wake</text>
  <path d="M420,206 Q370,230 320,272" class="ln" marker-end="url(#a)"/>
  <path d="M420,236 Q370,300 332,350" class="lf" marker-end="url(#f)"/>
  <path d="M420,256 Q370,380 332,440" class="lf" marker-end="url(#f)"/>
  <path d="M880,360 L960,404" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M880,480 L960,446" class="lf" marker-start="url(#f)" marker-end="url(#f)"/>
  <path d="M880,620 L944,620 L944,300 L957,300" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="890" y="608" class="s">reads;</text>
  <text x="952" y="560" class="s">board's</text>
  <text x="952" y="575" class="s">own writes</text>
  <path d="M182,476 L182,740 L1258,740 L1258,300 L1250,300" class="ln" marker-end="url(#a)"/>
  <text x="560" y="732" class="s">sessions write the planning folder through the CLI (orders, hand-backs, records)</text>
  <path d="M280,476 L280,772 L1272,772 L1272,166 L1251,166" class="ln" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <text x="560" y="766" class="s">agents use git and the forge themselves (push, PRs)</text>

  <!-- legend -->
  <rect x="32" y="820" width="1216" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="48" y="838" width="34" height="20" rx="5" class="now"/>
  <text x="90" y="853" class="t">on main today</text>
  <rect x="210" y="838" width="34" height="20" rx="5" class="later"/>
  <text x="252" y="853" class="t">room the foundations make (not built by them)</text>
  <text x="600" y="853" class="t">Rules kept: the files stay the truth; the server never edits a batch; an order is always the Chief of Staff's.</text>
</svg>
