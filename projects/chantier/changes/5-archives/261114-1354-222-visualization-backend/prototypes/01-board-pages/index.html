<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chantier · board (prototype 6)</title>
<script src="data.js"></script>
<style>
:root{
  --bg:#eef0f3; --panel:#fff; --side:#f7f7f8; --line:#e6e7ea; --line2:#eeeff1;
  --ink:#16181d; --ink2:#454a58; --ink3:#666b78;
  --blue:#3b6fe0; --green:#2fa86b; --red:#d6455d; --amber:#d98a1c; --violet:#8b5cf6; --grey:#9aa0ab;
  --chip:#f3f4f6; --radius:12px;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
}
*{box-sizing:border-box}
::selection{background:#d6e2fa;color:var(--ink)}
:focus-visible{outline:2px solid #2a62c9;outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:#cdd1d8 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdd1d8;border-radius:10px;border:3px solid #fff}::-webkit-scrollbar-track{background:transparent}
a{text-underline-offset:3px}
td > b:first-child{white-space:nowrap}
.svgi{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.nav .ic .svgi{width:17px;height:17px}
.bnav .ic .svgi{width:21px;height:21px}
.car .svgi{width:14px;height:14px;vertical-align:-2px}
.meta .svgi,.nm .svgi,.pm .svgi{width:13px;height:13px;vertical-align:-2px}
.prlink .svgi{width:12px;height:12px;vertical-align:-1px}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-size:14px;overflow:hidden}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.ws{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:#c8401f;color:#fff;display:grid;place-items:center;font-weight:700}
.ws small{display:block;color:var(--ink3);font-size:12px}
.ws{width:100%;text-align:left;cursor:pointer;position:relative}
.ws:hover{border-color:#cfd3da}
.ws .car{margin-left:auto;color:var(--ink3);font-size:12px}
.pwrap{position:relative}
.pmenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:0;border-radius:10px;box-shadow:0 8px 24px rgba(20,24,31,.12);padding:6px;z-index:20;min-width:240px}
.pmenu.open{display:block}
.pmenu .ph{color:var(--ink3);font-size:12px;padding:4px 8px 6px}
.popt{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:8px;padding:7px 8px;text-align:left}
.popt:hover{background:#f3f4f6}
.popt.on{background:#f4f6fb}
.popt .logo{width:26px;height:26px;border-radius:7px;font-size:12px}
.popt small{display:block;color:var(--ink3);font-size:12px}
.popt .ok{margin-left:auto;color:var(--ink2)}
.live{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;margin-left:4px;vertical-align:middle}
.pbtn{display:none}
.mut{color:var(--ink3)}
.aptab{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
.aptab th{text-align:left;color:var(--ink3);font-weight:500;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.aptab td{padding:12px 10px;border-bottom:1px solid var(--line2,#eef0f3);vertical-align:middle}
.aptab tr[data-pick]{cursor:pointer}
.aptab tr[data-pick]:hover td{background:#fafbfc}
.aptab tr.hasrev td:first-child{box-shadow:inset 0 0 0 0 transparent}
.aptab td:first-child{display:flex;align-items:center;gap:9px}
.aptab .logo{width:26px;height:26px;border-radius:7px;font-size:12px}
.aptab .num{white-space:nowrap}
.prlink{display:inline-block;border:1px solid #cbe9d7;background:#f6fcf8;color:#1d6b43;border-radius:7px;padding:2px 7px;margin:2px 4px 2px 0;font-size:12px;text-decoration:none;font-weight:600}
.prlink:hover{border-color:#8fcfaa}
.mbar{width:110px;height:6px;border-radius:4px;background:#eef0f3;overflow:hidden;margin-bottom:3px}
.mbar i{display:block;height:100%;background:#b9a3e6}
.apcards{display:none}
.apc{background:var(--bg,#fff);border:1px solid var(--bc,var(--line));border-radius:9px;padding:11px 12px;margin-bottom:10px;cursor:pointer}
.apt{display:flex;align-items:center;gap:8px;font-size:14px}
.apt .logo{width:24px;height:24px;border-radius:7px;font-size:12px}
.apt .mut{font-size:12px}
.aps{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--ink2);font-size:12.5px}
.aps b{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--ink2);text-align:center;margin-top:20px;line-height:1.6}
.sec{margin:16px 6px 4px;color:var(--ink2);font-size:12px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;color:var(--ink2);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#eceef1}
.nav.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .n{margin-left:auto;color:var(--ink3);font-size:12px}
.nav .ic{width:18px;text-align:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;color:var(--ink3);font-size:12px;line-height:1.6}
.main{background:var(--panel);padding:24px 28px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:flex-start;gap:12px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.stats{margin-top:6px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--ink)}
.cta{white-space:nowrap;margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.fchip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;color:var(--ink2);font-size:13px}
.filters .count{margin-left:auto;color:var(--ink3);font-size:13px}
.view{flex:1;min-height:0;overflow:auto}
/* kanban */
.board{display:flex;gap:12px;height:100%;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 290px;background:#f6f7f9;border:1px solid var(--line2);border-radius:12px;padding:8px;max-height:100%;overflow:auto}
.colh{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;font-weight:600}
.colh .c{background:#e9ebef;border-radius:6px;padding:0 6px;font-size:12px;color:var(--ink2);font-weight:500}
.colsub{padding:0 6px 10px 23px;color:var(--ink3);font-size:12px}
.add{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;color:var(--ink2);margin-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--bc,#e6e7ea),#1b2030 22%)}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px #dbe5fb}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.t-P1{background:#fde8ec;color:#c03552}.t-P2{background:#fdf0df;color:#b86e0c}.t-P3{background:#e8effd;color:#2f5fc7}.t-P4,.t-inbox{background:#f0f0f2;color:#6a6f7c}
.t-cr{background:#efe9fe;color:#6d43d6}
.t-rel{background:#f0f0f2;color:#454a58}
.src{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 5px;white-space:nowrap}
.src .svgi{width:12px;height:12px;vertical-align:0}
.lab{display:inline-flex;align-items:center;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;line-height:18px;color:var(--lc);background:color-mix(in srgb,var(--lc) 11%,#fff);border:1px solid color-mix(in srgb,var(--lc) 28%,#fff)}
.labs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lfil{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lfil .lt{font-size:12px;color:var(--ink3)}
.lbtn{cursor:pointer}.lbtn.on{background:var(--lc);color:#fff;border-color:var(--lc)}
.lclr{border:0;background:none;color:var(--blue);font-size:12px;cursor:pointer}
.late{flex:none;color:#8a5208;display:inline-flex}.late .svgi{width:13px;height:13px}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 24px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.aswrap{position:relative;margin-bottom:8px}
.asy{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;text-align:left;color:var(--ink)}
.asy:hover{border-color:color-mix(in srgb,var(--line) 60%,var(--ink3))}
.asy span:nth-child(2){flex:1;min-width:0}.asy b{display:block;font-size:12px}.asy small{display:block;color:var(--ink3);font-size:11px}
.asy .svgi{width:13px;height:13px;transform:rotate(-90deg);color:var(--ink3)}
.adot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.apop{display:none;position:absolute;left:0;bottom:calc(100% + 6px);width:300px;background:#fff;border-radius:10px;box-shadow:0 0 0 1px rgba(20,24,31,.06),0 10px 30px rgba(0,0,0,.12);padding:12px;z-index:20;font-size:12.5px;color:var(--ink)}
.apop.open{display:block}
.apop .ah{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.apop dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 8px}.apop dt{color:var(--ink3)}.apop dd{margin:0}
.apop .aw{border-radius:8px;padding:8px;margin-bottom:8px;line-height:1.4}.apop .aw.ko{background:#fff4f5;color:#9c2a41}.apop .aw.wa{background:#fff6ec;color:#7a4a0c}
.apop .aw .btn{display:block;margin-top:6px}
.apop .aa{display:flex;gap:6px;margin-bottom:8px}
.asim{border-top:1px solid var(--line2);padding-top:8px;color:var(--ink3);font-size:11px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.asim button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 6px;font-size:11px;color:var(--ink2)}.asim button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.asph{display:none;vertical-align:top;margin:0 0 8px 6px}
.asyd{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:33px;display:grid;place-items:center}
.asph .apop{position:fixed;left:12px;right:12px;top:58px;bottom:auto;width:auto}
.row:has(.src){flex-wrap:nowrap}.row:has(.src)>.tag,.row:has(.src)>.gs,.row:has(.src)>.late{flex:none}
.row:has(.src)>.lbl,.row:has(.src)>.sl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-verbal{color:#666b78;padding:1px 3px}.src-github{background:#eceef1;color:#24292f}.src-gitlab{background:#fdeee6;color:#a8400f}.src-jira{background:#e6effc;color:#1d58c4}
.s-working{background:#e8effd;color:#2f5fc7}.s-queued{background:#f0f0f2;color:#6a6f7c}.s-blocked{background:#fde8ec;color:#c03552}.s-ready{background:#e3f6ec;color:#1f7a4b}.s-waiting{background:#fdf0df;color:#8a5208}.s-merged{background:#e3f6ec;color:#1f7a4b}
.lbl{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.ttl{margin-top:6px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc{margin-top:4px;color:var(--ink2);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bars{display:flex;gap:3px;margin-top:10px}
.bars i{flex:1;height:4px;border-radius:2px;background:#e8e9ec}
.meta{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--ink2);font-size:12px}
.meta .r{margin-left:auto}
.empty{color:var(--ink3);font-size:12px;padding:10px 8px}
/* batch */
.bhead{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--ink2)} .kpi b{display:block;font-size:21px;margin-top:4px;font-weight:600}
.kpi .sub{color:var(--ink3);font-size:12px;margin-top:4px}
.meter{height:6px;background:#eceef1;border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.legend{display:flex;gap:14px;align-items:center;color:var(--ink2);font-size:12px;margin-bottom:10px;flex-wrap:wrap}
.legend .k{display:flex;gap:6px;align-items:center}
.graph{position:relative;display:flex;gap:90px;align-items:flex-start;padding:8px 4px 30px;min-width:max-content}
.lvl{display:flex;flex-direction:column;gap:12px;width:300px;position:relative;z-index:1}
.lvlh{color:var(--ink3);font-size:12px;font-weight:600;margin-bottom:-2px}
.grp{border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.grp .gh{font-size:12px;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center;padding:2px 2px 4px}
.st-queued,.st-cancelled{--bc:#e0e3e8;--bg:#fbfbfc}
.st-working{--bc:#cddcf6;--bg:#f7faff}
.st-waiting{--bc:#f1dcb8;--bg:#fffaf2}
.st-blocked{--bc:#f1cfcf;--bg:#fff8f8}
.st-ready{--bc:#cbe9d7;--bg:#f6fcf8}
.st-merged{--bc:#e0d5f3;--bg:#fbf9ff}
.node{background:var(--bg,#fff);border:1px solid var(--bc,var(--line));border-radius:9px;padding:8px 10px;cursor:pointer;transition:opacity .15s,box-shadow .15s}
.node:hover{border-color:color-mix(in srgb,var(--bc,#e6e7ea),#1b2030 22%)}
.node .nt{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .nm{display:flex;gap:8px;color:var(--ink3);font-size:12px;margin-top:5px}
.node .nm .r{margin-left:auto}
.node.dim{opacity:.28}.node.hl{box-shadow:0 0 0 2px #dbe5fb}
.node.sel{box-shadow:0 0 0 2px var(--blue)}
.mode{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:-4px 0 14px;font-size:12.5px;color:var(--ink2)}
.mode .mb{font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.mode .ms{display:flex;gap:4px;margin-left:auto}.mode .ms span{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink3);font-size:12px}
.mode .ms span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:18px;align-items:start}
.gscroll{overflow-x:auto;min-width:0}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prcol{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfbfc;display:flex;flex-direction:column;gap:7px}
.prcol h3{margin:0 0 2px;font-size:13px;display:flex;gap:6px;align-items:center}.prcol h3 .c{margin-left:auto;color:var(--ink3);font-weight:500}
.prcol .hint{color:var(--ink3);font-size:12px;margin:-2px 0 4px}
.prc{display:block;text-decoration:none;color:inherit;background:var(--bg,#fff);border:1px solid var(--bc,var(--line));border-radius:9px;padding:8px 10px;transition:box-shadow .15s}
.prc:hover{border-color:color-mix(in srgb,var(--bc,#e6e7ea),#1b2030 22%)}
.prc .top{display:flex;gap:6px;align-items:center;font-size:12px}.prc .top b{font-size:13px}
.prc .top .pos{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:1px 6px}
.prc .nt{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prc .nm{display:flex;gap:8px;color:var(--ink3);font-size:12px;margin-top:5px;align-items:center}
.prc .nm .r{margin-left:auto}.prc .fold{border:1px solid var(--line);border-radius:6px;padding:0 6px;cursor:pointer;color:var(--ink2)}
.prc.draft{opacity:.8}
.prsub{color:var(--ink3);font-size:12px;font-weight:600;margin-top:6px}
.stackrail{border-left:2px dashed var(--line);margin-left:8px;padding-left:8px;display:flex;flex-direction:column;gap:7px}
svg.edges{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
svg.edges path{fill:none;stroke:#c7ccd6;stroke-width:1.4;transition:stroke .15s,opacity .15s}
svg.edges path.hl{stroke:var(--blue);stroke-width:2}
svg.edges path.dim{opacity:.15}
.note{color:var(--ink3);font-size:12px;margin-top:6px;max-width:760px}
/* costs */
.age{display:flex;gap:10px;align-items:center;color:var(--ink2);margin:16px 0 12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tbl{border:1px solid var(--line);border-radius:12px;padding:6px 10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink3);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfc}
.hbar{height:8px;background:var(--blue);border-radius:4px;opacity:.85}
h2.t{font-size:15px;margin:22px 0 8px}
/* home */
.hgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}
.hc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;min-width:0}
.hc h2{margin:0 0 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.hc h2 .more{margin-left:auto;font-weight:400;font-size:12px;color:var(--blue);cursor:pointer;border:0;background:none}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}
.att{display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);cursor:pointer;min-width:0}
.att b{font-size:26px;font-weight:600;line-height:1.1}
.att span{color:var(--ink2);font-size:12.5px}
.att .l{font-size:12px;font-weight:600;color:var(--ink)}
.att.hot{background:#fff4f5;border-color:#f3c9d1}.att.hot b{color:var(--red)}
.att.go{background:#eefaf3;border-color:#bfe8d1}.att.go b{color:#1f7a4b}
.att.calm b{color:var(--ink3)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eceef1;margin:6px 0 8px}
.stack i{display:block;height:100%}
.slegend{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:12px}
.slegend span{display:flex;gap:5px;align-items:center}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.mini div{border-top:1px solid var(--line2);padding-top:8px}
.mini small{color:var(--ink3);font-size:12px;display:block}
.mini b{font-size:16px;font-weight:600}

const SCOL = {working:"var(--blue)", queued:"var(--grey)", waiting:"var(--amber)", blocked:"var(--red)", ready:"var(--green)", merged:"var(--green)"};
const crs = B ? B.crs : [];
const byId = Object.fromEntries(crs.map(c => [c.cr, c]));
const RDY = "3-ready";                                   /* the folder that waits for the next batch */
const DEF = (B && B.default_branch) || "main";
const isFix = c => c.kind === "fix", isRel = c => c.kind === "release";
const open_ = c => c && !["merged", "cancelled"].includes(c.state);
const vstate = c => c.state === "queued" && c.waits && c.waits.length ? "waiting" : c.state;
const lim = c => c.rounds || (B && B.max_rounds) || null;
const rtxt = c => lim(c) ? c.round + "/" + lim(c) : String(c.round);
/* the stack or the series, bottom first: every CR but a fix, the release on top */
const chainOf = () => crs.filter(c => open_(c) && !isFix(c)).sort((a, b) => (isRel(a) - isRel(b)) || (a.order ?? 0) - (b.order ?? 0));
/* where a CR's PR sits: its place in the stack, the previous CR of a series, else its last open dependency, else the default branch */
function baseOf(c){
  if (isFix(c)) return {on:DEF, txt:"sur " + DEF + ", hors stack"};
  const chain = chainOf(), k = chain.indexOf(c);
  if (B.mode === "stack" && c.stacked) return k > 0 ? {on:chain[k - 1].cr, txt:"sur " + chain[k - 1].cr} : {on:DEF, txt:"sur " + DEF + ", bas de la stack"};
  if (B.mode === "series" && k > 0) return {on:chain[k - 1].cr, txt:"sur " + chain[k - 1].cr + ", brouillon jusqu'à son merge"};
  const dep = [...(c.after || [])].reverse().find(id => open_(byId[id]));
  const b = dep ? {on:dep, txt:"sur " + dep + ", sa dépendance ouverte"} : {on:DEF, txt:"sur " + DEF};
  if (B.mode === "stack") b.txt += " · pas encore empilée";
  return b;
}
/* to review = handed back ready, and its PR on the default branch, or its stack verified on the forge */
const reviewable = c => c.state === "ready" && (B.mode === "stack" && !isFix(c) ? !!B.stack_verified : baseOf(c).on === DEF);

/* ---- every openable thing, by key ---- */
const OBJ = {};
S.items.forEach(x => OBJ["i:" + x.item] = {kind:"item", key:"i:" + x.item, title:x.title, folder:x.folder, files:x.files, x});
crs.forEach(c => OBJ["c:" + c.cr] = {kind:"cr", key:"c:" + c.cr, title:c.title, folder:c.folder, files:c.files, c});

function firstPara(files){
  const f = files.find(f => f.path === "03-change-spec.md") || files.find(f => f.path === "01-intent.md") || files.find(f => /\.md$/.test(f.path) && f.text);
  const t = f && f.text || "";
  const p = t.split(/\n\s*\n/).map(s => s.trim()).find(s => s && !s.startsWith("#") && !/^issue:/.test(s));
  return (p || "").replace(/[`*_>]/g, "").replace(/\s+/g, " ");
}
const nFiles = files => files.length;
/* where the request comes from: in the real board, a field of the JSON the agent refreshes
   (read from the `issue:` line, else "verbal"); here read the same way, plus three simulated examples */
const DEMO_SRC = {"docs-sphinx-rtd":"https://github.com/gsemet/chantier/issues/41", "landing-page":"https://gitlab.com/gsemet/chantier/-/issues/12", "epoch-required-everywhere":"https://example.atlassian.net/browse/CHT-118"};
const SRCI = {
  github:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>',
  gitlab:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 13l2.5-9 2.5 7h8l2.5-7 2.5 9z"/></svg>',
  jira:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h16v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
  verbal:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>'};
function srcOf(o){
  const f = o.files.find(f => f.path === "01-intent.md") || o.files.find(f => f.path === "03-change-spec.md");
  const m = f && f.text && f.text.match(/^issue:\s*(https?:\/\/\S+)/m);
  const url = m ? m[1] : DEMO_SRC[slug(o.folder)], demo = !m && !!url;
  if (!url) return {kind:"verbal", label:"", title:"demande verbale (dans le chat)"};
  const kind = /github\.com/.test(url) ? "github" : /gitlab/.test(url) ? "gitlab" : /atlassian|jira/.test(url) ? "jira" : "github";
  const ref = kind === "jira" ? url.split("/").pop() : "#" + url.split("/").pop();
  return {kind, url, label:ref, title:{github:"ticket GitHub", gitlab:"ticket GitLab", jira:"ticket Jira"}[kind] + " " + ref + (demo ? " (exemple simulé)" : "")};
}
const DEMO_LATE = new Set(["visualization-backend", "audit-force-upstream-exemption"]);

const srcTag = o => { const s = srcOf(o); return `<span class="src src-${s.kind}" title="${esc(s.title)}" aria-label="${esc(s.title)}">${SRCI[s.kind]}${s.label ? esc(s.label) : ""}</span>`; };

    {name:"In progress", sub:(B ? B.batch : "aucun batch") + " : en file, au travail, bloqué", color:"var(--blue)", items:crs.filter(c => ["queued","working","blocked"].includes(c.state)).sort((a,b) => ["blocked","working","queued"].indexOf(a.state) - ["blocked","working","queued"].indexOf(b.state)).map(c => OBJ["c:" + c.cr])},

function kcard(o){

function kanban(){

/* ---- batch: grouped on the current batch, its dependencies ---- */
function levels(){
  const lv = {}, seen = new Set();
  const L = id => { if (lv[id] != null) return lv[id]; if (seen.has(id)) return 0; seen.add(id);
    const c = byId[id]; const deps = (c ? c.after : []).filter(d => byId[d]);
    return lv[id] = deps.length ? 1 + Math.max(...deps.map(L)) : 0; };
  crs.forEach(c => L(c.cr));
  const cols = [];
  crs.forEach(c => (cols[lv[c.cr]] = cols[lv[c.cr]] || []).push(c));
  return cols;
}
function node(c){
  return `<div class="node st-${esc(vstate(c))}" data-open="c:${esc(c.cr)}" data-id="${esc(c.cr)}">
    <div class="row"><span class="tag t-cr">${esc(c.cr)}</span><span class="lbl">${esc(slug(c.folder))}</span></div>
    <div class="nt">${esc(c.title)}</div>
    <div class="nm"><span>r${rtxt(c)}</span>${c.after.length ? `<span>${IC.dep} ${c.after.length}</span>` : ""}${c.pr ? `<span>PR</span>` : ""}<span class="r">${usd(c.cost)}</span></div></div>`;
}
function batch(){
  if (!B) return `<p class="empty">Aucun batch en cours.</p>`;
  const cols = levels(), order = ["blocked","working","ready","waiting","queued","merged"];
  const by = s => crs.filter(c => c.state === s).length;
  const lvl = (cs, i) => {
    const groups = order.map(s => [s, cs.filter(c => vstate(c) === s)]).filter(g => g[1].length);
    return `<div class="lvl"><div class="lvlh">${i === 0 ? "Sans dépendance" : "Niveau " + i + " : après le niveau " + (i - 1)}</div>
      ${groups.map(([s, g]) => `<div class="grp"><div class="gh"><span class="dot" style="background:${SCOL[s]}"></span>${STATE[s]} · ${g.length}</div>${g.map(node).join("")}</div>`).join("")}</div>`;
  };
  return `<div class="bhead">
      <div class="kpi"><small>Batch</small><b>${esc(B.batch)}</b><div class="sub">${esc(B.state)} · ${esc(B.mode)} · ${B.steering === "direct" ? "direct" : "Foreman"}</div></div>
      <div class="kpi"><small>Slots</small><b>${B.slots.taken}/${B.slots.total}</b><div class="sub">${by("queued")} en file</div></div>
      <div class="kpi"><small>Au travail</small><b>${by("working")}</b><div class="sub">${by("blocked")} bloqué(s)</div></div>
      <div class="kpi"><small>Rendus ready</small><b>${by("ready")}</b><div class="sub">${crs.filter(reviewable).length} à revoir · ${by("merged") || 0} mergés</div></div>
      <div class="kpi"><small>Dépensé</small><b>${usd(B.spent_usd)}</b><div class="meter"><i style="width:${Math.min(100, B.spent_usd / B.budget_usd * 100)}%"></i></div><div class="sub">sur ${usd(B.budget_usd)}</div></div>
    </div>
    ${modeBar()}
    <div class="bwrap"><div class="gscroll">
    <div class="legend">${order.map(s => `<span class="k"><span class="dot" style="background:${SCOL[s]}"></span>${STATE[s]}</span>`).join("")}
      <span class="k">— une flèche va d'un CR à celui qui l'attend (depends.json, ou une chaîne décidée)</span></div>
    <div class="graph" id="graph"><svg class="edges" id="edges"></svg>${cols.map(lvl).join("")}</div>
    <div class="note">Survole un CR pour voir ce qu'il attend et qui l'attend ; clique pour ouvrir son dossier.</div></div>
    ${prCols()}</div>`;
}
/* ---- the batch's mode, and its PRs: to review (in merge order), merged ---- */
const MODES = {
  stack: ["Stack", "#2f6fdf", "chaque PR repose sur la précédente, la release en haut ; une fois la stack vérifiée sur le forge, tu la merges en une action depuis sa PR du haut."],
  series: ["Série", "#c07a12", "un CR après l'autre : le suivant part de la branche du précédent, sa PR reste brouillon jusqu'au merge du précédent ; la release en dernier."],
  parallel: ["Parallèle", "#2e9d62", "chaque PR part de la branche par défaut, ou de sa dépendance ouverte : tu merges dans l'ordre où elles sont prêtes, la release après les autres."]};
function modeBar(){
  const m = MODES[B.mode] || [B.mode, "var(--grey)", ""];
  return `<div class="mode"><span class="mb" style="background:${m[1]}">${esc(m[0])}</span><span>${esc(m[2])}</span>
    <span class="ms">${Object.keys(MODES).map(k => `<span class="${k === B.mode ? "on" : ""}">${MODES[k][0]}</span>`).join("")}</span></div>`;
}
function mergeOrder(){
  /* stack and series: the chain, bottom first, the release on top, a fix apart; parallel: the order they became ready */
  const open = crs.filter(c => c.pr && open_(c));
  return B.mode === "parallel" ? open.sort((a, b) => (isRel(a) - isRel(b)) || (a.updated || "").localeCompare(b.updated || ""))
                               : open.sort((a, b) => (isFix(a) - isFix(b)) || (isRel(a) - isRel(b)) || (a.order ?? 0) - (b.order ?? 0));
}
function prCard(c, i, cls){
  const chain = chainOf(), k = chain.indexOf(c), stacked = B.mode === "stack" && !isFix(c) && k >= 0;
  let place = "";
  if (cls !== "mrg"){
    if (stacked) place = `<span class="pos" title="place dans la stack, 1 = le bas ; pas un ordre de merge">${k === chain.length - 1 ? "haut · " : ""}${k + 1}</span>`;
    else if (cls === "" && B.mode !== "stack") place = `<span class="pos" title="ordre de merge recommandé">${i + 1}</span>`;
  }
  const why = cls === "draft" ? (c.state === "ready" ? "rendu, PR brouillon" : STATE[vstate(c)] || c.state) : "";
  return `<a class="prc ${cls} st-${esc(vstate(c))}" href="${esc(c.pr)}" target="_blank" rel="noopener" title="ouvrir la PR">
    <div class="top"><b>${prn(c.pr)}</b><span class="tag t-cr">${esc(c.cr)}</span>${isRel(c) ? '<span class="tag t-rel">release</span>' : isFix(c) ? '<span class="tag t-rel">fix</span>' : ""}${place}</div>
    <div class="nt">${esc(c.title)}</div>
    <div class="nm"><span>${cls === "mrg" ? "mergée il y a " + ago(c.updated) : esc(baseOf(c).txt)}</span>${why ? `<span>${esc(why)}</span>` : ""}<span class="r">${usd(c.cost)}</span><span class="fold" data-openp="c:${esc(c.cr)}" title="ouvrir le dossier du CR" aria-label="ouvrir le dossier du CR">${IC.folder}</span></div></a>`;
}
function prCols(){
  const all = mergeOrder(), top = l => B.mode === "stack" ? [...l].reverse() : l;   /* a stack reads from its top PR, where it is merged */
  const ready = all.filter(reviewable), drafts = all.filter(c => !reviewable(c));
  const merged = crs.filter(c => c.state === "merged" && c.pr).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  const before = S.merged.filter(m => m.batch !== B.batch).slice(0, 4);
  const hint = B.mode === "stack" ? (B.stack_verified ? "La stack est vérifiée sur le forge : tu la merges en une action, depuis sa PR du haut. Les numéros sont des places dans la stack, pas un ordre de merge."
                                                       : "La stack n'est pas encore faite et vérifiée sur le forge : ses PR restent des brouillons, rien à merger. Les numéros sont des places dans la stack.")
    : B.mode === "series" ? "De bas en haut : la première, puis la suivante une fois rebasée sur " + DEF + "." : "Chacune se merge seule, dans l'ordre où elles sont devenues prêtes ; la release après les autres.";
  const wrap = h => B.mode === "stack" ? `<div class="stackrail">${h}</div>` : h;
  return `<div class="prs">
    <div class="prcol"><h3><span class="dot" style="background:var(--green)"></span>PR à revoir<span class="c">${ready.length}</span></h3>
      <div class="hint">${hint} Un clic ouvre la PR.</div>
      ${ready.length ? wrap(top(ready).map((c, i) => prCard(c, i, "")).join("")) : '<div class="empty">Aucune PR à revoir pour l\'instant.</div>'}
      ${drafts.length ? `<div class="prsub">Brouillons, pas encore à revoir · ${drafts.length}</div>${wrap(top(drafts).map((c, i) => prCard(c, i, "draft")).join(""))}` : ""}</div>
    <div class="prcol"><h3><span class="dot" style="background:#8a63d2"></span>PR mergées<span class="c">${merged.length}</span></h3>
      <div class="hint">Pour info.</div>
      ${merged.map(c => prCard(c, 0, "mrg")).join("") || '<div class="empty">Aucune dans ce batch.</div>'}
      ${before.length ? `<div class="prsub">Batchs précédents</div>${before.map(m => `<a class="prc mrg st-merged" href="${esc(m.pr)}" target="_blank" rel="noopener"><div class="top"><b>${prn(m.pr)}</b><span class="tag t-cr">${esc(m.cr)}</span><span style="margin-left:auto;color:var(--ink3)">${esc(m.batch)}</span></div><div class="nt">${esc(m.title)}</div></a>`).join("")}` : ""}</div>
  </div>`;
}
function drawEdges(){
  const g = $("#graph"), svg = $("#edges"); if (!g) return;
  const gr = g.getBoundingClientRect(); let p = "";
  crs.forEach(c => c.after.forEach(d => {
    const a = g.querySelector(`[data-id="${d}"]`), b = g.querySelector(`[data-id="${c.cr}"]`); if (!a || !b) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.right - gr.left, y1 = ra.top + ra.height / 2 - gr.top, x2 = rb.left - gr.left, y2 = rb.top + rb.height / 2 - gr.top, mx = (x1 + x2) / 2;
    p += `<path data-from="${d}" data-to="${c.cr}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}" marker-end="url(#ar)"/>`;
  }));
  svg.setAttribute("width", g.scrollWidth); svg.setAttribute("height", g.scrollHeight);
  svg.innerHTML = `<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aab1bf"/></marker></defs>` + p;
}
function bindBatch(){
  drawEdges();
  $$("[data-openp]").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); openPanel(b.dataset.openp); });
  $$(".node").forEach(n => {
    n.onmouseenter = () => {
      const id = n.dataset.id, rel = new Set([id]);
      (byId[id].after || []).forEach(d => rel.add(d)); crs.forEach(c => c.after.includes(id) && rel.add(c.cr));
      $$(".node").forEach(m => { m.classList.toggle("dim", !rel.has(m.dataset.id)); m.classList.toggle("hl", rel.has(m.dataset.id) && m !== n); });
      $$("#edges path[data-from]").forEach(e => { const on = e.dataset.from === id || e.dataset.to === id; e.classList.toggle("hl", on); e.classList.toggle("dim", !on); });
    };
    n.onmouseleave = () => { $$(".node").forEach(m => m.classList.remove("dim", "hl")); $$("#edges path").forEach(e => e.classList.remove("hl", "dim")); };
  });
}

/* ---- costs ---- */
let costAt = S.updated, recomputing = false;

  const sum = crs.reduce((s, c) => s + (c.cost || 0), 0), max = Math.max(...crs.map(c => c.cost || 0), .01);
  const rows = [...crs].sort((a, b) => (b.cost || 0) - (a.cost || 0));
  const mmax = Math.max(...S.merged.map(m => m.cost || 0), .01);
  return `<div class="age">Dernier calcul : il y a <b>${ago(costAt)}</b>
      <button class="btn ${recomputing ? "" : "pri"}" id="recalc" ${recomputing ? "disabled" : ""}>${recomputing ? "recalcul…" : "↻ Recalculer"}</button>
      <span style="font-size:12px;color:var(--ink3)">le serveur relit les transcripts : aucun tour d'agent</span></div>
    <div class="kpis">
      <div class="kpi"><small>Dépensé (${esc(B.batch)})</small><b>${usd(B.spent_usd)}</b><div class="meter"><i style="width:${Math.min(100, B.spent_usd / B.budget_usd * 100)}%"></i></div></div>
      <div class="kpi"><small>Budget</small><b>${usd(B.budget_usd)}</b><div class="sub">${Math.round(B.spent_usd / B.budget_usd * 100)} % utilisé</div></div>
      <div class="kpi"><small>Somme des CRs</small><b>${usd(sum)}</b><div class="sub">le reste : le steering</div></div>
      <div class="kpi"><small>Coût moyen par CR actif</small><b>${usd(sum / Math.max(1, crs.filter(c => c.cost).length))}</b><div class="sub">${crs.filter(c => c.cost).length} CRs avec un coût</div></div>
    </div>

/* ---- markdown (small) ---- */
function md(t){
  const lines = t.split("\n"); let out = "", code = false, list = false, tbl = false;
  const il = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<u>$1</u>");
  const close = () => { if (list){ out += "</ul>"; list = false; } if (tbl){ out += "</table>"; tbl = false; } };
  for (const l of lines){
    if (l.startsWith("```")){ close(); out += code ? "</code></pre>" : "<pre><code>"; code = !code; continue; }
    if (code){ out += esc(l) + "\n"; continue; }
    if (/^\s*\|/.test(l)){ if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!tbl){ close(); out += "<table>"; tbl = true; }
      out += "<tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map(c => "<td>" + il(c.trim()) + "</td>").join("") + "</tr>"; continue; }
    const li = l.match(/^\s*[-*] (.*)/) || l.match(/^\s*\d+\. (.*)/);
    if (li){ if (tbl){ out += "</table>"; tbl = false; } if (!list){ out += "<ul>"; list = true; } out += "<li>" + il(li[1]) + "</li>"; continue; }
    if (list && /^\s{2,}\S/.test(l)){ out = out.replace(/<\/li>$/, " " + il(l.trim()) + "</li>"); continue; }
    close();
    const h = l.match(/^(#{1,4}) (.*)/);
    if (h){ out += `<h${h[1].length}>${il(h[2])}</h${h[1].length}>`; continue; }
    if (l.trim()) out += "<p>" + il(l) + "</p>";
  }
  close(); return out;
}
