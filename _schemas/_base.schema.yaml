# Fields every document of a planning bundle may carry (OKF 0.2). Applied through `allOf: [$ref]`.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  type:
    type: string
    description: The document kind; selects `<type>.schema.yaml` in `_schemas/`.
  title: {type: string}
  description:
    type: string
    description: One sentence summarizing the document.
  generated:
    type: object
    description: "OKF 0.2 provenance: who produced the content and when it last changed."
    properties:
      by: {type: string, description: "Actor, e.g. human:gsemet or agent:claude-opus-5-5."}
      at: {type: string, format: date-time}
    required: [by, at]
    additionalProperties: false
  links:
    type: array
    items: {type: string, x-okf-link: {resolution: bundle-relative, syntax: plain}}
  backlinks:
    type: array
    items: {type: string, x-okf-link: {resolution: bundle-relative, syntax: plain}}
required: [type, description]
