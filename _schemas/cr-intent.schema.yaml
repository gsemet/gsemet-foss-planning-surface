# 01-intent.md: the pre-analysis of a change request, the current understanding of the subject for
# the operator and for agents. Kept small on purpose: everything else is in the body, in intake/,
# or derived from the folder by `just validate` (stage, priority).
$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "_base.schema.yaml"
type: object
properties:
  type: {const: cr-intent}
  id:
    type: string
    description: The CR folder name, `<issue>-<slug>`.
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
  description: {type: string}
  generated: true
  sources:
    $ref: "_sources.schema.yaml"
    minItems: 1
    description: OKF 0.2 sources; the first entry is the issue in its tracker.
required: [type, id, description, generated, sources]
unevaluatedProperties: false
