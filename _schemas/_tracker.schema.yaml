# Where a project's issues are filed: one shape per tracker kind, so the code can live on GitHub or
# GitLab and the issues on GitHub, GitLab or Jira.
$schema: "https://json-schema.org/draft/2020-12/schema"
oneOf:
  - type: object
    properties:
      kind: {const: github}
      repository: {type: string, description: owner/name}
    required: [kind, repository]
    additionalProperties: false
  - type: object
    properties:
      kind: {const: gitlab}
      host: {type: string}
      project: {type: string, description: group/subgroup/name}
    required: [kind, host, project]
    additionalProperties: false
  - type: object
    properties:
      kind: {const: jira}
      site: {type: string, format: uri, description: "e.g. https://acme.atlassian.net"}
      project_key: {type: string, pattern: "^[A-Z][A-Z0-9_]+$"}
    required: [kind, site, project_key]
    additionalProperties: false
