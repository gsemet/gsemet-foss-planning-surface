# Where a project's code and issues live. One shape per tracker kind, so a project can keep its
# code on GitHub or GitLab and its issues on GitHub, GitLab or Jira.
$schema: "https://json-schema.org/draft/2020-12/schema"
$defs:
  repository:
    type: object
    properties:
      forge: {enum: [github, gitlab]}
      host: {type: string, description: "Forge host, e.g. github.com or gitlab.example.com."}
      path: {type: string, description: "owner/name, or group/subgroup/name on GitLab."}
      default_branch: {type: string}
      url: {type: string, format: uri}
    required: [forge, path, default_branch]
    additionalProperties: false
  tracker:
    description: Where the project's issues are filed.
    oneOf:
      - type: object
        properties:
          kind: {const: github}
          repository: {type: string, description: owner/name}
        required: [kind, repository]
        additionalProperties: false
      - type: object
        properties:
          kind: {const: gitlab}
          host: {type: string}
          project: {type: string, description: group/subgroup/name}
        required: [kind, host, project]
        additionalProperties: false
      - type: object
        properties:
          kind: {const: jira}
          site: {type: string, format: uri, description: "e.g. https://acme.atlassian.net"}
          project_key: {type: string, pattern: "^[A-Z][A-Z0-9_]+$"}
        required: [kind, site, project_key]
        additionalProperties: false
  issue:
    description: One issue in a tracker, as received.
    oneOf:
      - type: object
        properties:
          kind: {const: github}
          repository: {type: string}
          number: {type: integer, minimum: 1}
          url: {type: string, format: uri}
        required: [kind, repository, number, url]
        additionalProperties: false
      - type: object
        properties:
          kind: {const: gitlab}
          host: {type: string}
          project: {type: string}
          iid: {type: integer, minimum: 1}
          url: {type: string, format: uri}
        required: [kind, host, project, iid, url]
        additionalProperties: false
      - type: object
        properties:
          kind: {const: jira}
          site: {type: string, format: uri}
          key: {type: string, pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$"}
          url: {type: string, format: uri}
        required: [kind, site, key, url]
        additionalProperties: false
